name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: pharma_ci
          POSTGRES_DB: pharma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharma" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pharma:pharma_ci@localhost:5432/pharma?schema=public
      REDIS_URL: redis://localhost:6379
      DOCUMENT_HASH_SECRET: ci-only-document-hash-secret-0000
      SESSION_TOKEN_SECRET: ci-only-session-token-secret-00000
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (altas y críticas)
        run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Presupuesto de peso (PWA <= 300 KB gzip de JS inicial, juegos <= 1,5 MB)
        run: pnpm size
      - name: Integración contra PostgreSQL y Redis reales (base pharma_test, Redis db 1)
        run: pnpm test:int
      - name: Migración y semillas contra PostgreSQL real
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
          pnpm exec prisma db seed
